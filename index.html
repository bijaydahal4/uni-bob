<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Uni Bob</title>
  <meta name="description" content="Explore universities for Economics and similar courses, check your chances and plan your application.">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Uni Bob">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply her chosen theme before the first paint (no flash).
    try {
      var s = JSON.parse(localStorage.getItem('unibob:v1') || 'null');
      if (s && s.settings && s.settings.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:24px;font-family:system-ui">Uni Bob needs JavaScript turned on.</p></noscript>
</body>
</html>
